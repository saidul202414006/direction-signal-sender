; TX Broadcaster Firmware — ESP32-S3 (PERMANENT TX)
; WiFi CSI Zone Detection Project
;
; ROLE HISTORY & FUTURE PLAN:
;   Current TX:  ESP32-S3 (this board) — COM5, MAC: 10:51:db:85:fe:b8
;   Future TX:   ESP32 DevKit V1 — when Type-B USB cable is obtained
;   When DevKit arrives: change [env] board to esp32dev, reflash DevKit as TX,
;                        reflash this S3 board as RX_S3_B (rx_receiver firmware).
;
; Based on official esp-csi/examples/get-started/csi_send
; PlatformIO + ESP-IDF framework

[env:tx_s3]
platform              = espressif32
board                 = esp32-s3-devkitc-1
framework             = espidf
board_build.flash_size = 16MB

; NOTE: ESP32-S3 has 8MB embedded PSRAM on this board — confirmed by esptool.
; TX firmware does NOT need PSRAM; no PSRAM config required here.

build_flags =
    -DCONFIG_NODE_ID=\"TX_S3\"
    -DCONFIG_WIFI_CHANNEL=6
    -DCONFIG_WIFI_BANDWIDTH=WIFI_BW_HT20
    -DCONFIG_ESP_NOW_PHYMODE=WIFI_PHY_MODE_HT20
    -DCONFIG_SEND_FREQUENCY=100
    -DCONFIG_CSI_SEND_MAC_0=0x1a
    -DCONFIG_CSI_SEND_MAC_1=0x00
    -DCONFIG_CSI_SEND_MAC_2=0x00
    -DCONFIG_CSI_SEND_MAC_3=0x00
    -DCONFIG_CSI_SEND_MAC_4=0x00
    -DCONFIG_CSI_SEND_MAC_5=0x00

monitor_speed = 115200
upload_speed  = 921600
upload_port   = COM5

; ── Future: ESP32 DevKit V1 TX (uncomment when cable is obtained) ───────────
