; RX Receiver Firmware — Shared template for ESP32-S3 and AM-036
; Based on official esp-csi/examples/get-started/csi_recv pattern
; PlatformIO + ESP-IDF framework
;
; HOW TO FLASH EACH BOARD:
;   1. Change [env] section to match target board (esp32-s3 or esp32dev)
;   2. Change NODE_ID build flag to the correct board ID
;   3. Connect board, run: pio run -t upload
;
; Node ID mapping:
;   RX_S3_A  — ESP32-S3 #1 (Corner 1, Phase 1+)
;   RX_S3_B  — ESP32-S3 #2 (Corner 2, Phase 2+)
;   RX_AM_A  — AM-036 #1   (Corner 3, Phase 4+)
;   RX_AM_B  — AM-036 #2   (Corner 4, Phase 4+)
;   RX_AM_C  — AM-036 #3   (Backup, Phase 4 if needed)

[env]
board_build.esp-idf.sdkconfig_defaults = sdkconfig.defaults

; ── Flash for ESP32-S3 boards (RX_S3_A, RX_S3_B) ──────────────────────────
[env:rx_s3_a]
platform              = espressif32
board                 = esp32-s3-devkitc-1
framework             = espidf
board_build.flash_size = 16MB
upload_port           = COM6
build_flags =
    -DCONFIG_NODE_ID=\"RX_S3_A\"
    -DCONFIG_WIFI_CHANNEL=2
    -DCONFIG_WIFI_BANDWIDTH=WIFI_BW_HT20
    -DCONFIG_ESP_NOW_PHYMODE=WIFI_PHY_MODE_HT20
    -DCONFIG_CSI_SEND_MAC_0=0x1a
    -DCONFIG_CSI_SEND_MAC_1=0x00
    -DCONFIG_CSI_SEND_MAC_2=0x00
    -DCONFIG_CSI_SEND_MAC_3=0x00
    -DCONFIG_CSI_SEND_MAC_4=0x00
    -DCONFIG_CSI_SEND_MAC_5=0x00
monitor_speed = 921600
upload_speed  = 921600

[env:rx_s3_b]
platform              = espressif32
board                 = esp32-s3-devkitc-1
framework             = espidf
build_flags =
    -DCONFIG_NODE_ID=\"RX_S3_B\"
    -DCONFIG_WIFI_CHANNEL=2
    -DCONFIG_WIFI_BANDWIDTH=WIFI_BW_HT20
    -DCONFIG_ESP_NOW_PHYMODE=WIFI_PHY_MODE_HT20
    -DCONFIG_CSI_SEND_MAC_0=0x1a
    -DCONFIG_CSI_SEND_MAC_1=0x00
    -DCONFIG_CSI_SEND_MAC_2=0x00
    -DCONFIG_CSI_SEND_MAC_3=0x00
    -DCONFIG_CSI_SEND_MAC_4=0x00
    -DCONFIG_CSI_SEND_MAC_5=0x00
monitor_speed = 115200
upload_speed  = 921600

; ── Flash for AM-036 boards (RX_AM_A, RX_AM_B, RX_AM_C) ───────────────────
; AM-036 = TTGO T-Call clone, classic ESP32 chip (same as esp32dev)
; WARNING: Confirm SIM800L has NO SIM card before flashing!
[env:rx_am_a]
platform              = espressif32
board                 = esp32dev
framework             = espidf
build_flags =
    -DCONFIG_NODE_ID=\"RX_AM_A\"
    -DCONFIG_WIFI_CHANNEL=2
    -DCONFIG_WIFI_BANDWIDTH=WIFI_BW_HT20
    -DCONFIG_ESP_NOW_PHYMODE=WIFI_PHY_MODE_HT20
    -DCONFIG_CSI_SEND_MAC_0=0x1a
    -DCONFIG_CSI_SEND_MAC_1=0x00
    -DCONFIG_CSI_SEND_MAC_2=0x00
    -DCONFIG_CSI_SEND_MAC_3=0x00
    -DCONFIG_CSI_SEND_MAC_4=0x00
    -DCONFIG_CSI_SEND_MAC_5=0x00
monitor_speed = 115200
upload_speed  = 921600

